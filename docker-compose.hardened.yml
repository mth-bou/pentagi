# Optional fail-closed control boundary. See backend/docs/fork-hardening.md.
# Requires Compose >=2.24.4 for !override. Never use an upstream application image.
services:
  pentagi:
    user: "0:0" # staged mTLS files must be owned by UID 0; see deployment guide
    image: ${PENTAGI_HARDENED_IMAGE:?Build the fork and set PENTAGI_HARDENED_IMAGE}
    environment:
      DOCKER_HOST: ${PENTAGI_WORKER_DOCKER_HOST:?Set the dedicated rootless worker daemon TCP endpoint}
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /opt/pentagi/docker/ssl
      DOCKER_REQUIRE_ROOTLESS: "true"
      DOCKER_EGRESS_MODE: isolated
      DOCKER_NETWORK: ${PENTAGI_LAB_NETWORK:-pentagi-lab}
      DOCKER_INSIDE: "false"
      DOCKER_NET_ADMIN: "false"
      DOCKER_SOCKET: ""
      DOCKER_INSIDE_HOST: ""
      DOCKER_INSIDE_CERT_PATH: ""
      DOCKER_WORK_DIR: ""
      DOCKER_WORKER_ALLOW_PRIVILEGE_ESCALATION: "false"
      EXTERNAL_SSL_INSECURE: "false"
    # Replace the entire list to remove the local host's Docker socket and the
    # ambient Ollama signing identity. A read-only socket would still allow writes
    # through the Docker API, so marking the original socket :ro is insufficient.
    volumes: !override
      - ${PENTAGI_DATA_DIR:-pentagi-data}:/opt/pentagi/data
      - ${PENTAGI_SSL_DIR:-pentagi-ssl}:/opt/pentagi/ssl
      - ${PENTAGI_LLM_SERVER_CONFIG_PATH:-./example.custom.provider.yml}:/opt/pentagi/conf/custom.provider.yml:ro
      - ${PENTAGI_OLLAMA_SERVER_CONFIG_PATH:-./example.ollama.provider.yml}:/opt/pentagi/conf/ollama.provider.yml:ro
      - ${PENTAGI_BEDROCK_CONFIG_PATH:-./example.bedrock.provider.yml}:/opt/pentagi/conf/bedrock.provider.yml:ro
      - ${PENTAGI_WORKER_TLS_DIR:?Set the worker mTLS client certificate directory}:/opt/pentagi/docker/ssl:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 1024
